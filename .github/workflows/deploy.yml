name: Deploy to production (k3s)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: rabotai/mvp2
  MANIFESTS_PATH: ~/k8s-infra/bots/mvp2

jobs:
  # ── 1. Сборка и пуш Docker-образа на Docker Hub ──────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ── 2. Деплой в k3s через SSH ────────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Apply k8s manifests via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOTENV: ${{ secrets.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: DOTENV
          script: |
            set -e

            echo "==> Updating k8s-infra repo (no-op if not a git checkout)..."
            git -C ~/k8s-infra pull --ff-only || echo "skip git pull (not a repo / no remote)"

            echo "==> Creating namespace..."
            kubectl create namespace mvp2 --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Updating env Secret from DOTENV..."
            printf '%s' "$DOTENV" > /tmp/mvp2.env
            kubectl create secret generic mvp2-secret \
              --namespace=mvp2 \
              --from-env-file=/tmp/mvp2.env \
              --save-config --dry-run=client -o yaml | kubectl apply -f -
            rm -f /tmp/mvp2.env

            echo "==> Applying kustomization..."
            kubectl apply -k ${{ env.MANIFESTS_PATH }}

            echo "==> Restarting app deployment..."
            kubectl rollout restart deployment/mvp2 -n mvp2

            echo "==> Waiting for rollout..."
            kubectl rollout status deployment/mvp2 -n mvp2 --timeout=10m || {
              echo "=== Pods ==="; kubectl get pods -n mvp2 -o wide
              echo "=== Describe ==="; kubectl describe deployment mvp2 -n mvp2
              echo "=== init(migrate) logs ==="; kubectl logs -n mvp2 -l app.kubernetes.io/name=mvp2 -c migrate --tail=80 || true
              echo "=== api logs ==="; kubectl logs -n mvp2 -l app.kubernetes.io/name=mvp2 -c api --tail=80 || true
              echo "=== worker logs ==="; kubectl logs -n mvp2 -l app.kubernetes.io/name=mvp2 -c worker --tail=80 || true
              exit 1
            }

            echo "==> Pod status:"
            kubectl get pods -n mvp2
